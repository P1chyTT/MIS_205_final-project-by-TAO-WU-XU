            currentGalleryImages = post.image_urls;
            currentGalleryIndex = 0;
            
            updateGallery();
            document.getElementById('imageGalleryModal').style.display = 'flex';
        }
        
        // 更新画廊显示
        function updateGallery() {
            if (currentGalleryImages.length === 0) return;
            
            const mainImg = document.getElementById('galleryMainImg');
            const thumbContainer = document.getElementById('galleryThumbnails');
            
            mainImg.src = currentGalleryImages[currentGalleryIndex];
            
            thumbContainer.innerHTML = '';
            currentGalleryImages.forEach((img, index) => {
                const thumb = document.createElement('img');
                thumb.src = img;
                thumb.className = `gallery-thumb ${index === currentGalleryIndex ? 'active' : ''}`;
                thumb.onclick = () => {
                    currentGalleryIndex = index;
                    updateGallery();
                };
                thumbContainer.appendChild(thumb);
            });
        }
        
        // 画廊导航
        function prevImage() {
            if (currentGalleryImages.length === 0) return;
            currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            updateGallery();
        }
        
        function nextImage() {
            if (currentGalleryImages.length === 0) return;
            currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryImages.length;
            updateGallery();
        }
        
        // 关闭画廊
        function closeGallery() {
            document.getElementById('imageGalleryModal').style.display = 'none';
        }
        
        // 键盘导航
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('imageGalleryModal');
            if (modal.style.display === 'flex') {
                if (e.key === 'Escape') closeGallery();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });

        // ===== 查看帖子详情 =====
        async function viewPostDetail(postId) {
            // 加载帖子详情
            const { data: post, error } = await sb.from('posts')
                .select('*')
                .eq('id', postId)
                .single();
            
            if (error || !post) {
                alert('加载帖子失败: ' + (error?.message || '未找到'));
                return;
            }
            
            // 加载费用
            const { data: expenses } = await sb.from('trip_expenses')
                .select('*')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });
            
            // 加载参与者
            const { data: participants } = await sb.from('participations')
                .select('user_id, joined_at')
                .eq('post_id', postId);
            
            // 加载参与者用户名
            const participantUsers = [];
            if (participants && participants.length > 0) {
                for (const part of participants) {
                    const { data: profile } = await sb.from('profiles')
                        .select('username')
                        .eq('id', part.user_id)
                        .single();
                    participantUsers.push({
                        user_id: part.user_id,
                        username: profile?.username || '用户',
                        joined_at: part.joined_at
                    });
                }
            }
            
            // 显示详情页
            showPostDetail(post, expenses || [], participantUsers);
        }
        
        // ===== 显示帖子详情 =====
        function showPostDetail(post, expenses, participants) {
            // 更新导航
            document.getElementById('detailTab').style.display = 'block';
            switchSection('detail');
            
            // 基本信息
            document.getElementById('detailTitle').textContent = post.title;
            document.getElementById('detailAuthor').textContent = `👤 ${post.author_name}`;
            document.getElementById('detailType').textContent = post.type === 'buddy' ? '👥 找搭子' : '🛒 拼单';
            document.getElementById('detailStatus').textContent = getStatusText(post.status);
            document.getElementById('detailTime').textContent = `📅 ${new Date(post.created_at).toLocaleString('zh-CN')}`;
            
            // 描述
            const descEl = document.getElementById('detailDescription');
            descEl.innerHTML = post.description ? `<p>${escHtml(post.description)}</p>` : '<p style="color:#888">无详细描述</p>';
            
            // 图片
            const imagesEl = document.getElementById('detailImages');
            if (post.image_urls && post.image_urls.length > 0) {
                imagesEl.innerHTML = '<h3>🖼️ 图片</h3><div class="post-images-grid">';
                post.image_urls.forEach((img, index) => {
                    imagesEl.innerHTML += `<img src="${img}" alt="帖子图片" onclick="viewImageGalleryFromDetail(${post.id})">`;
                });
                imagesEl.innerHTML += '</div>';
            } else {
                imagesEl.innerHTML = '';
            }
            
            // 行程费用
            renderExpenses(post, expenses);
            
            // 联系方式
            renderContactInfo(post);
            
            // 参与者
            renderParticipants(post, participants);
            
            // 操作按钮
            renderDetailActions(post);
        }
        
        // ===== 渲染行程费用 =====
        function renderExpenses(post, expenses) {
            const expensesList = document.getElementById('expensesList');
            const expensesSummary = document.getElementById('expensesSummary');
            const expensesActions = document.getElementById('expensesActions');
            
            if (expenses.length === 0) {
                expensesList.innerHTML = '<p style="color:#888;text-align:center;padding:1rem">暂无费用记录</p>';
                expensesSummary.innerHTML = '';
            } else {
                // 费用列表
                let total = 0;
                let html = '';
                expenses.forEach(expense => {
                    total += parseFloat(expense.amount);
                    html += `
                    <div class="expense-item">
                        <div>
                            <div class="expense-name">${escHtml(expense.name)}</div>
                            ${expense.note ? `<div class="expense-note">${escHtml(expense.note)}</div>` : ''}
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <div class="expense-amount">¥${parseFloat(expense.amount).toFixed(2)}</div>
                            ${isParticipant ? 
                                `<button class="delete-expense-btn" onclick="deleteExpense(${post.id}, ${expense.id})">删除</button>` : 
                                ''
                            }
                        </div>
                    </div>`;
                });
                expensesList.innerHTML = html;
                
                // 费用汇总
                const perPerson = total / post.max_people;
                expensesSummary.innerHTML = `
                <div class="expense-total">
                    <span>💰 总费用：¥${total.toFixed(2)}</span>
                    <span class="per-person-cost">人均：¥${perPerson.toFixed(2)}</span>
                </div>`;
            }
            
            // 操作按钮（所有参与者都可以添加费用）
            const isParticipant = myParticipations.has(post.id) || post.user_id === currentUser.id;
            if (isParticipant) {
                expensesActions.innerHTML = `
                <div class="add-expense-form">
                    <input type="text" id="expenseName" placeholder="费用项目（如：车费、餐费）">
                    <input type="number" id="expenseAmount" placeholder="金额" step="0.01" min="0">
                    <input type="text" id="expenseNote" placeholder="备注（可选）">
                    <button onclick="addExpense(${post.id})">添加</button>
                </div>`;
            } else {
                expensesActions.innerHTML = '';
            }
        }
        
        // ===== 添加费用 =====
        async function addExpense(postId) {
            // 检查数据库是否支持费用功能
            if (!dbSupportsExpenses) {
                alert('费用功能暂不可用。\n\n需要在Supabase SQL Editor中运行数据库迁移脚本：\n\nmigration_add_expenses_contact.sql');
                return;
            }
            
            const name = document.getElementById('expenseName').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const note = document.getElementById('expenseNote').value.trim();
            
            if (!name) {
                alert('请输入费用项目名称');
                return;
            }
            if (!amount || amount <= 0) {
                alert('请输入有效的金额');
                return;
            }
            
            const { error } = await sb.from('trip_expenses').insert([{
                post_id: postId,
                name: name,
                amount: amount,
                note: note || null
            }]);
            
            if (error) {
                alert('添加失败: ' + error.message);
                return;
            }
            
            // 清空表单
            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expenseNote').value = '';
            
            // 重新加载详情
            await viewPostDetail(postId);
        }
        
        // ===== 删除费用 =====
        async function deleteExpense(postId, expenseId) {
            if (!confirm('确定要删除这个费用项目吗？')) {
                return;
            }
            
            const { error } = await sb.from('trip_expenses')
                .delete()
                .eq('id', expenseId);
            
            if (error) {
                alert('删除失败: ' + error.message);
                return;
            }
            
            // 重新加载详情
            await viewPostDetail(postId);
        }
        
        // ===== 渲染联系方式 =====
        function renderContactInfo(post) {
            const contactSection = document.getElementById('contactSection');
            const contactInfoDisplay = document.getElementById('contactInfoDisplay');
            
            // 如果数据库不支持联系方式，直接隐藏
            if (!dbSupportsContact) {
                contactSection.style.display = 'none';
                return;
            }
            
            // 检查当前用户是否是参与者
            const isParticipant = myParticipations.has(post.id) || post.user_id === currentUser.id;
            
            if (post.contact_type && post.contact_info && isParticipant) {
                let icon = '';
                let label = '';
                switch (post.contact_type) {
                    case 'qq': icon = '🐧'; label = 'QQ'; break;
                    case 'wechat': icon = '💬'; label = '微信'; break;
                    case 'phone': icon = '📱'; label = '电话'; break;
                }
                contactInfoDisplay.innerHTML = `
                <div class="contact-info-display">
                    <span class="contact-icon">${icon}</span>
                    <span>${label}：${escHtml(post.contact_info)}</span>
                </div>`;
                contactSection.style.display = 'block';
            } else if (post.contact_type && post.contact_info && !isParticipant) {
                contactInfoDisplay.innerHTML = '<p style="color:#888;text-align:center">参与后可见联系方式</p>';
                contactSection.style.display = 'block';
            } else {
                contactSection.style.display = 'none';
            }
        }
        
        // ===== 渲染参与者 =====
        function renderParticipants(post, participants) {
            const participantsList = document.getElementById('participantsList');
            
            // 添加发起人
            let allParticipants = [{
                user_id: post.user_id,
                username: post.author_name,
                joined_at: post.created_at,
                is_creator: true
            }];
            
            // 添加其他参与者
            if (participants && participants.length > 0) {
                allParticipants = allParticipants.concat(participants.map(p => ({...p, is_creator: false})));
            }
            
            let html = '';
            allParticipants.forEach(participant => {
                const initial = participant.username.charAt(0).toUpperCase();
                const joinTime = new Date(participant.joined_at).toLocaleString('zh-CN');
                html += `
                <div class="participant-item">
                    <div class="participant-avatar">${initial}</div>
                    <div>
                        <div class="participant-name">${escHtml(participant.username)} ${participant.is_creator ? '（发起人）' : ''}</div>
                        <div class="participant-joined">加入时间：${joinTime}</div>
                    </div>
                </div>`;
            });
            
            participantsList.innerHTML = html;
        }
        
        // ===== 渲染详情页操作按钮 =====
        function renderDetailActions(post) {
            const detailActions = document.getElementById('detailActions');
            const isMine = post.user_id === currentUser.id;
            const isJoined = myParticipations.has(post.id);
            const isFull = post.current_people >= post.max_people;
            const isCancelled = post.status === 'cancelled';
            const isFinished = post.status === 'finished';
            
            let html = '';
            
            if (isMine) {
                // 发起人操作
                html += `<button class="edit-btn" onclick="editPost(${post.id})">编辑帖子</button>`;
                html += `<button class="delete-btn" onclick="deletePost(${post.id})">删除帖子</button>`;
            } else if (!isCancelled && !isFinished && !isFull && !isJoined) {
                // 可以参与
                html += `<button class="join-btn" onclick="joinPostFromDetail(${post.id})">参与</button>`;
            } else if (isJoined) {
                // 已参与
                html += `<button class="join-btn joined" onclick="leavePostFromDetail(${post.id})">退出</button>`;
            }
            
            detailActions.innerHTML = html;
        }
        
        // ===== 从详情页参与 =====
        async function joinPostFromDetail(postId) {
            await joinPost(postId);
            await viewPostDetail(postId); // 重新加载详情
        }
        
        // ===== 从详情页退出 =====
        async function leavePostFromDetail(postId) {
            await leavePost(postId);
            await viewPostDetail(postId); // 重新加载详情
        }
        
        // ===== 从详情页查看图片画廊 =====
        function viewImageGalleryFromDetail(postId) {
            viewImageGallery(postId);
        }
        
        // ===== 获取状态文本 =====
        function getStatusText(status) {
            switch (status) {
                case 'open': return '🟢 招募中';
                case 'closed': return '🟡 已满员';
                case 'completed': return '🟠 待确认';
                case 'finished': return '🔵 已完成';
                case 'cancelled': return '🔴 已取消';
                default: return status;
            }
        }

        // ===== HTML 转义 =====
        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
    <!-- 图片画廊模态框 -->
    <div id="imageGalleryModal" class="image-gallery-modal">
        <button class="gallery-close" onclick="closeGallery()">×</button>
        <button class="gallery-nav gallery-prev" onclick="prevImage()">‹</button>
        <div class="gallery-container">
            <img id="galleryMainImg" class="gallery-main-img" src="" alt="">
            <div id="galleryThumbnails" class="gallery-thumbnails"></div>
        </div>
        <button class="gallery-nav gallery-next" onclick="nextImage()">›</button>
    </div>
</body>
</html>
