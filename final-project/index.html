<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园搭子拼单系统 - 登录/注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            margin-bottom: -2px;
        }
        
        .form { display: none; }
        .form.active { display: block; }
        
        h2 { text-align: center; margin-bottom: 1.5rem; color: #333; }
        
        .form-group { margin-bottom: 1rem; }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        input:focus { outline: none; border-color: #667eea; }
        
        button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        button:hover { opacity: 0.9; }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        .message.error { background: #fee; color: #c33; display: block; }
        .message.success { background: #efe; color: #3c3; display: block; }
        
        .config-section {
            margin-top: 2rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        .config-section h3 { margin-bottom: 0.5rem; color: #333; }
        .config-section input { margin-bottom: 0.5rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">登录</button>
            <button class="tab" onclick="switchTab('register')">注册</button>
        </div>
        
        <!-- 登录表单 -->
        <div id="loginForm" class="form active">
            <h2>欢迎回来</h2>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="loginEmail">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword">
            </div>
            <button onclick="handleLogin()">登录</button>
            <div id="loginMessage" class="message"></div>
        </div>
        
        <!-- 注册表单 -->
        <div id="registerForm" class="form">
            <h2>创建账号</h2>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="registerUsername">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="registerEmail">
            </div>
            <div class="form-group">
                <label>密码 (至少6位)</label>
                <input type="password" id="registerPassword">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="registerConfirmPassword">
            </div>
            <button onclick="handleRegister()">注册</button>
            <div id="registerMessage" class="message"></div>
        </div>

        <!-- Supabase 配置区域 -->
        <div class="config-section">
            <h3>Supabase 配置</h3>
            <div class="form-group">
                <label>项目 URL</label>
                <input type="text" id="supabaseUrl" placeholder="https://xxx.supabase.co">
            </div>
            <div class="form-group">
                <label>Anon Key</label>
                <input type="text" id="supabaseKey" placeholder="你的anon key">
            </div>
            <button onclick="saveConfig()" style="background: #4CAF50;">保存配置</button>
            <div id="configMessage" class="message"></div>
        </div>
    </div>

    <!-- Supabase JavaScript 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabaseClient = null;

        // 页面加载时读取配置
        window.onload = function() {
            const savedUrl = localStorage.getItem('sbUrl');
            const savedKey = localStorage.getItem('sbKey');
            if (savedUrl) document.getElementById('supabaseUrl').value = savedUrl;
            if (savedKey) document.getElementById('supabaseKey').value = savedKey;
            if (savedUrl && savedKey) initSupabase(savedUrl, savedKey);
        };

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form');
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function showMsg(elementId, text, isError) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = isError ? 'message error' : 'message success';
        }

        function initSupabase(url, key) {
            try {
                supabaseClient = window.supabase.createClient(url, key);
                showMsg('configMessage', 'Supabase 连接成功！', false);
                return true;
            } catch (e) {
                showMsg('configMessage', '初始化失败: ' + e.message, true);
                return false;
            }
        }

        function saveConfig() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            
            if (!url || !key) {
                showMsg('configMessage', '请填写 URL 和 Key', true);
                return;
            }
            
            localStorage.setItem('sbUrl', url);
            localStorage.setItem('sbKey', key);
            
            if (initSupabase(url, key)) {
                showMsg('configMessage', '配置已保存！', false);
            }
        }

        async function handleLogin() {
            if (!supabaseClient) {
                showMsg('loginMessage', '请先配置 Supabase', true);
                return;
            }
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });
                
                if (error) {
                    showMsg('loginMessage', error.message, true);
                } else {
                    showMsg('loginMessage', '登录成功！', false);
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                }
            } catch (err) {
                showMsg('loginMessage', '错误: ' + err.message, true);
            }
        }

        async function handleRegister() {
            if (!supabaseClient) {
                showMsg('registerMessage', '请先配置 Supabase', true);
                return;
            }
            
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showMsg('registerMessage', '两次密码不一致', true);
                return;
            }
            
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { username: username } }
                });
                
                if (error) {
                    showMsg('registerMessage', error.message, true);
                } else {
                    showMsg('registerMessage', '注册成功！', false);
                    setTimeout(() => switchTab('login'), 1500);
                }
            } catch (err) {
                showMsg('registerMessage', '错误: ' + err.message, true);
            }
        }
    </script>
</body>
</html>
